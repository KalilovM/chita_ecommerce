# =============================================================
# Nginx — HTTP-only (initial certificate issuance)
# =============================================================
# This config is used ONLY during the first deploy to serve the
# ACME challenge so Certbot can issue the SSL certificate.
# After the cert is obtained, deploy.sh swaps this for nginx.conf.
# =============================================================

events {
    worker_connections 1024;
}

http {
    # ---------- Logging ----------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name gala75.ru www.gala75.ru;

        # Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else → 503 until SSL is ready
        location / {
            return 503 "Service is starting up — SSL certificate being provisioned.\n";
            add_header Content-Type text/plain;
        }
    }
}
