# =============================================================
# Nginx - Production SSL reverse proxy for gala75.ru
# =============================================================

events {
    worker_connections 1024;
}

http {
    # ---------- Basic settings ----------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ---------- Logging ----------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---------- Gzip ----------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---------- Rate limiting ----------
    limit_req_zone $binary_remote_addr zone=general:10m  rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m     rate=3r/s;
    limit_req_zone $binary_remote_addr zone=api:10m      rate=20r/s;

    # ---------- Upstream ----------
    upstream nextjs {
        server app:3000;
        keepalive 64;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # ---------- Proxy defaults ----------
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_buffering    on;
    proxy_buffer_size  128k;
    proxy_buffers      4 256k;
    proxy_busy_buffers_size 256k;

    # =================================================================
    # HTTP -> HTTPS redirect + ACME challenge passthrough
    # =================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name gala75.ru www.gala75.ru _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        return 301 https://gala75.ru$request_uri;
    }

    # =================================================================
    # www -> non-www redirect (HTTPS)
    # =================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.gala75.ru;

        ssl_certificate     /etc/letsencrypt/live/gala75.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gala75.ru/privkey.pem;

        return 301 https://gala75.ru$request_uri;
    }

    # =================================================================
    # Main HTTPS server - gala75.ru
    # =================================================================
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name gala75.ru;

        # ---------- SSL ----------
        ssl_certificate     /etc/letsencrypt/live/gala75.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gala75.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout    5s;

        # ---------- Security headers ----------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;

        # ---------- Client body ----------
        client_max_body_size 20M;

        # ---------- Next.js static assets ----------
        location /_next/static/ {
            proxy_pass http://nextjs;
            expires    365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ---------- Public static files ----------
        location /public/ {
            proxy_pass http://nextjs;
            expires    30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ---------- Auth endpoints ----------
        location ~ ^/(api/auth|login|register) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://nextjs;
        }

        # ---------- API routes ----------
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://nextjs;
        }

        # ---------- All other routes ----------
        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://nextjs;
        }

        # ---------- Block hidden files ----------
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
